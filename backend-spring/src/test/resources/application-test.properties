# Test profile - H2 in-memory database
spring.datasource.url=jdbc:h2:mem:gastromind_db_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT Configuration for tests
gastromind.jwt.secret=GastroMindTestSecretKeyForJWTTokenGeneration2026
gastromind.jwt.expiration-ms=86400000

# HU-04: en los tests el correo se simula (CorreoService con @MockitoBean); no se conecta a ningún SMTP
spring.mail.host=localhost
gastromind.recuperacion.expiracion-minutos=15

# HU-16: en los tests la revisión diaria no corre sola ("-" la desactiva); se llama directo a AlertaService
gastromind.alertas.vencimiento-cron=-
