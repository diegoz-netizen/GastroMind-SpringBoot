spring.application.name=backend-spring

spring.profiles.active=local

# Fechas en UTC al leer/escribir en la BD (ver BackendSpringApplication)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# El esquema lo manda docs/script_database.sql (+ docs/migraciones/). Hibernate solo comprueba
# que las entidades coinciden con la BD y, si no, Spring no arranca (Planning 2, punto 4).
spring.jpa.hibernate.ddl-auto=validate

# HU-04: SMTP (Mailtrap en desarrollo). Credenciales por variables de entorno, nunca en el repo.
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# CORS: páginas que pueden llamar a la API desde el navegador (separadas por coma).
# En desarrollo, solo el React de Vite. En producción, el dominio real.
gastromind.cors.allowed-origins=http://localhost:5173

# HU-04: enlace de recuperación (CA-04: caduca a los 15 min)
gastromind.recuperacion.expiracion-minutos=15
gastromind.recuperacion.url-restablecer=http://localhost:5173/restablecer
