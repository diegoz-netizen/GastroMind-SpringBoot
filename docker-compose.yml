# GastroMind completo con un comando: docker compose up --build
# Asume los repos clonados uno al lado del otro (ver docs/DESPLIEGUE.md).
name: gastromind

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-gastromind_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en el .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Solo se ejecutan la primera vez, con el volumen vacío y en este orden
      - ./docs/script_database.sql:/docker-entrypoint-initdb.d/01_script_database.sql:ro
      - ./docs/seed_demo.sql:/docker-entrypoint-initdb.d/02_seed_demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-gastromind_db}"]
      interval: 5s
      timeout: 5s
      retries: 20

  spring:
    build: ./backend-spring
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-gastromind_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      GASTROMIND_JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en el .env}
      GASTROMIND_CORS_ALLOWED_ORIGINS: http://localhost:5173
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    ports:
      - "8080:8080"

  django:
    build: ${DJANGO_DIR:-../GastroMind-Django}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Falta DJANGO_SECRET_KEY en el .env}
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: ${DB_NAME:-gastromind_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: "5432"
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"

  web:
    build:
      context: ./web-react
      args:
        VITE_API_URL: http://localhost:8080
        VITE_DJANGO_URL: http://localhost:8000
    depends_on:
      - spring
      - django
    ports:
      - "5173:80"

volumes:
  db-data:
